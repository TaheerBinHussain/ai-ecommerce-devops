groups:
  - name: nexvion-availability
    rules:
      - alert: StorefrontDown
        expr: probe_success{job="nexvion-availability"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Storefront endpoint {{ $labels.instance }} is down"
          description: "Blackbox probe has failed for more than 1 minute."

      - alert: StorefrontSlow
        expr: probe_duration_seconds{job="nexvion-availability"} > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Storefront response time above 1s on {{ $labels.instance }}"

      - alert: NginxExporterDown
        expr: up{job="nexvion-nginx"} == 0
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Nginx metrics are not being collected"

  - name: nexvion-resources
    rules:
      - alert: HostHighCpu
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host CPU above 85% for 5 minutes"

      - alert: HostHighMemory
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Host memory above 90%"

      - alert: HostDiskAlmostFull
        expr: (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "Disk {{ $labels.mountpoint }} is above 85%"

  - name: nexvion-kubernetes
    rules:
      # Only evaluates when kube-state-metrics is present (Kubernetes deployments)
      - alert: PodCrashLooping
        expr: increase(kube_pod_container_status_restarts_total{namespace="ecommerce"}[15m]) > 3
        labels: { severity: critical }
        annotations:
          summary: "Pod {{ $labels.pod }} is restarting repeatedly"

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas{namespace="ecommerce"} != kube_deployment_status_replicas_available{namespace="ecommerce"}
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Deployment {{ $labels.deployment }} does not have all replicas available"
