# GitHub Actions: lightweight CI on every push / pull request (Jenkins remains the CD engine).
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: application/package-lock.json
      - name: Install, lint, test, build
        working-directory: application
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm test
          npm run build
      - name: AI incident analyzer tests
        run: python3 -m unittest discover -s ai/incident-analysis/tests -v

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform fmt / validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate
      - uses: azure/setup-helm@v4
      - name: Helm lint
        run: |
          helm lint helm/ecommerce -f helm/ecommerce/values-kind.yaml
          helm lint helm/ecommerce -f helm/ecommerce/values-aws.yaml
      - name: Shell script syntax
        run: for f in scripts/*.sh security/*.sh; do bash -n "$f"; done

  security:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Secret, dependency and configuration scans
        run: |
          security/scan.sh secrets
          security/scan.sh deps
          security/scan.sh config
      - name: Build image
        run: docker build -f docker/Dockerfile -t nexvion-store:ci .
      - name: Image scan
        run: security/scan.sh image nexvion-store:ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: security/reports/
