# Filebeat -> Logstash -> Elasticsearch pipeline for the NEXVION platform
input {
  beats { port => 5044 }
}

filter {
  # Nginx access log lines are JSON (see docker/nginx/default.conf)
  if [message] =~ /^\{/ {
    json {
      source => "message"
      target => "http"
      add_tag => ["access_log"]
    }
    if [http][@timestamp] {
      date { match => ["[http][@timestamp]", "ISO8601"] }
      mutate { remove_field => ["[http][@timestamp]"] }
    }
    if [http][status] >= 500 {
      mutate { add_field => { "log_level" => "error" } }
    } else if [http][status] >= 400 {
      mutate { add_field => { "log_level" => "warn" } }
    } else {
      mutate { add_field => { "log_level" => "info" } }
    }
  } else {
    # Nginx error log: 2026/10/23 06:57:14 [error] 29#29: *1 message
    grok {
      match => { "message" => "%{DATA:nginx_time} \[%{LOGLEVEL:log_level}\] %{NUMBER:pid}#%{NUMBER}: %{GREEDYDATA:error_message}" }
      add_tag => ["error_log"]
      tag_on_failure => ["unparsed"]
    }
  }

  if [container][name] {
    mutate { add_field => { "service" => "%{[container][name]}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "nexvion-logs-%{+YYYY.MM.dd}"
  }
}
