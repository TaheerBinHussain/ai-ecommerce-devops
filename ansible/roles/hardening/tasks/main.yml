- name: Install security packages
  ansible.builtin.apt:
    name: [ufw, fail2ban, unattended-upgrades, auditd]
    state: present

- name: Harden SSH daemon
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Firewall - default deny incoming
  community.general.ufw:
    default: deny
    direction: incoming

- name: Firewall - allow required ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ allowed_tcp_ports }}"

- name: Firewall - allow pod and service networks (k3s)
  community.general.ufw:
    rule: allow
    from_ip: "{{ item }}"
  loop: [10.42.0.0/16, 10.43.0.0/16]

- name: Enable firewall
  community.general.ufw:
    state: enabled

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      maxretry = 5
      bantime = 1h
  notify: Restart fail2ban

- name: Enable automatic security updates
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Kernel network hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"
