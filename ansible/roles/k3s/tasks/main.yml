- name: Download k3s installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"

- name: Install k3s server
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: >-
      server
      --write-kubeconfig-mode 600
      --tls-san {{ ansible_host }}
      --secrets-encryption
  args:
    creates: /usr/local/bin/k3s

- name: Wait for the node to become Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
  changed_when: false

- name: Read kubeconfig
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  register: k3s_kubeconfig_raw

- name: Save kubeconfig for Jenkins (server address rewritten to the public IP)
  ansible.builtin.copy:
    dest: "{{ k3s_kubeconfig_dest }}"
    mode: "0600"
    content: "{{ k3s_kubeconfig_raw.content | b64decode | replace('127.0.0.1', ansible_host) }}"
  delegate_to: localhost
  become: false
