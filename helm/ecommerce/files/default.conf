# Structured JSON access log: parsed by Logstash and analysed by the AI incident assistant
log_format json_combined escape=json
  '{"@timestamp":"$time_iso8601","service":"nexvion-store",'
  '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
  '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
  '"referer":"$http_referer","user_agent":"$http_user_agent","request_id":"$request_id"}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $request_id always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Liveness / readiness endpoint used by Docker, Kubernetes, Jenkins and blackbox probes
    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"nexvion-store"}';
    }

    # Build metadata (version, commit, build number)
    location = /version.json {
        add_header Cache-Control "no-store";
    }

    # Metrics source for nginx-prometheus-exporter (cluster / compose network only)
    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location ~* \.(css|js|png|jpg|jpeg|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
