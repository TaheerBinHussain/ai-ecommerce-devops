{{- if and .Values.secret.create (not .Values.secret.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecommerce.fullname" . }}
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | toString | b64enc | quote }}
  {{- end }}
{{- end }}
