apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ecommerce.fullname" . }}-test
  # Deliberately NOT the app selector labels, so the Deployment/HPA/Service never count this pod
  labels:
    app.kubernetes.io/name: nexvion-store-test
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: helm-test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: health
      image: busybox:1.36
      command: ["wget", "-q", "-O-", "http://{{ include "ecommerce.fullname" . }}:{{ .Values.service.port }}/health"]
      resources:
        requests: { cpu: 10m, memory: 8Mi }
        limits: { cpu: 50m, memory: 16Mi }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
