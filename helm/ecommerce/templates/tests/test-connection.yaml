apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ecommerce.fullname" . }}-test
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile: { type: RuntimeDefault }
  containers:
    - name: health
      image: busybox:1.36
      command: ["wget", "-q", "-O-", "http://{{ include "ecommerce.fullname" . }}:{{ .Values.service.port }}/health"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: { drop: [ALL] }
