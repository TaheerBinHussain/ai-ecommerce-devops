apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecommerce.fullname" . }}
  labels: {{- include "ecommerce.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "ecommerce.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
    {{- if .Values.metrics.exporter.enabled }}
    - { name: metrics, port: 9113, targetPort: metrics }
    {{- end }}
