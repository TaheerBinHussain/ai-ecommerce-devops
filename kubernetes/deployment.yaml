apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexvion-store
  namespace: ecommerce
  labels:
    app.kubernetes.io/name: nexvion-store
    app.kubernetes.io/part-of: ai-ecommerce-devops
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels: { app.kubernetes.io/name: nexvion-store }
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1          # add one new pod at a time
      maxUnavailable: 0    # never drop below the desired capacity -> zero downtime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexvion-store
        app.kubernetes.io/part-of: ai-ecommerce-devops
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        co.elastic.logs/enabled: "true"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: nexvion-store }
      containers:
        - name: nexvion
          image: localhost:5001/nexvion-store:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: nexvion-config }
            - secretRef: { name: nexvion-secrets }
          # Keep serving while the ingress controller removes this pod from its endpoints
          lifecycle:
            preStop:
              exec: { command: ["sleep", "10"] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: tmp, mountPath: /tmp }
        - name: nginx-exporter
          image: nginx/nginx-prometheus-exporter:1.3.0
          args: ["--nginx.scrape-uri=http://127.0.0.1:8080/nginx_status"]
          ports:
            - { name: metrics, containerPort: 9113 }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 50m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      volumes:
        - name: nginx-conf
          configMap:
            name: nexvion-config
            items: [{ key: default.conf, path: default.conf }]
        - name: tmp
          emptyDir: {}
