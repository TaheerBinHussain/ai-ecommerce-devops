# Runtime configuration: environment metadata + the nginx server block.
# Changing the nginx config here and running `kubectl rollout restart` applies it without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexvion-config
  namespace: ecommerce
  labels: { app.kubernetes.io/name: nexvion-store }
data:
  APP_ENV: "production"
  STORE_NAME: "NEXVION"
  LOG_FORMAT: "json"
  default.conf: |
    log_format json_combined escape=json
      '{"@timestamp":"$time_iso8601","service":"nexvion-store",'
      '"remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri",'
      '"status":$status,"bytes_sent":$body_bytes_sent,"request_time":$request_time,'
      '"referer":"$http_referer","user_agent":"$http_user_agent","request_id":"$request_id"}';
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        access_log /var/log/nginx/access.log json_combined;
        server_tokens off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location = /health { access_log off; default_type application/json; return 200 '{"status":"UP","service":"nexvion-store"}'; }
        location = /nginx_status { stub_status; access_log off; allow 127.0.0.1; deny all; }
        location / { try_files $uri $uri/ =404; }
    }
